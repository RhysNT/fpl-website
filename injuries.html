<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Compass — Injuries</title>
<meta name="description" content="FPL injury and availability tracker — who's out, doubtful or suspended, with the latest team news.">
<meta property="og:title" content="FPL Compass — Injury Tracker">
<meta property="og:description" content="Who's injured, doubtful or suspended in FPL right now.">
<meta property="og:type" content="website">
<style>
  :root {
    --ink: #10221c; --paper: #f2f6f3; --line: #d7ded9; --pitch: #1c5c40; --pitch-dark: #123c2a;
    --amber: #e2a83f; --rise: #1c8a54; --fall: #c0463a;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 0 0 4rem; }
  header { background: var(--pitch-dark); color: var(--paper); padding: 2.2rem 1.5rem 1.6rem; position: relative; overflow: hidden; }
  header::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 40px); pointer-events: none; }
  .kicker { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin: 0 0 0.4rem; }
  h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
  .sub { margin: 0.5rem 0 0; color: #b9c9c0; font-size: 0.95rem; max-width: 54ch; }
  nav { display: flex; gap: 1rem; margin-top: 1.2rem; flex-wrap: wrap; }
  nav a { color: #b9c9c0; text-decoration: none; font-family: var(--mono); font-size: 0.76rem; letter-spacing: 0.02em; padding-bottom: 0.2rem; border-bottom: 2px solid transparent; }
  nav a.active { color: white; border-bottom-color: var(--amber); }
  nav a:hover { color: white; }
  main { max-width: 1100px; margin: 1.5rem auto 0; padding: 0 1.5rem; }
  .table-wrap { background: white; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(16,34,28,0.06); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th { text-align: left; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6b63; padding: 0.7rem 0.6rem; border-bottom: 2px solid var(--pitch); }
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:hover { background: #eef4f0; }
  tbody td { padding: 0.6rem; vertical-align: middle; }
  .status-tag { display: inline-block; font-family: var(--mono); font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px; color: white; }
  .status-i { background: var(--fall); }
  .status-d { background: var(--amber); color: var(--ink); }
  .status-s { background: #8a5cc9; }
  .status-u { background: #6c7a72; }
  .news-cell { color: #445a4f; font-size: 0.8rem; }
  footer { max-width: 1100px; margin: 1.2rem auto 0; padding: 0 1.5rem; font-size: 0.78rem; color: #6c7a72; font-family: var(--mono); }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <p class="kicker">Injuries &amp; Availability</p>
  <h1>Who's out, who's doubtful</h1>
  <p class="sub">Every player flagged as anything other than fully available, straight from the FPL data.</p>
  <nav id="site-nav"></nav><noscript><div style="padding:0.5rem 0;"><a href="index.html" style="color:#b9c9c0;margin-right:0.8rem;">Player Stats</a><a href="price_changes.html" style="color:#b9c9c0;margin-right:0.8rem;">Price Changes</a><a href="fixtures.html" style="color:#b9c9c0;margin-right:0.8rem;">Fixtures</a><a href="my_team.html" style="color:#b9c9c0;margin-right:0.8rem;">Team Builder</a><a href="compare.html" style="color:#b9c9c0;margin-right:0.8rem;">Compare</a><a href="weekly_picks.html" style="color:#b9c9c0;margin-right:0.8rem;">Weekly Picks</a><a href="defcon.html" style="color:#b9c9c0;margin-right:0.8rem;">DEFCON</a><a href="injuries.html" style="color:#b9c9c0;margin-right:0.8rem;">Injuries</a><a href="chips.html" style="color:#b9c9c0;">Chips</a></div></noscript>
</header>
<main>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Player</th><th>Team</th><th>Pos</th><th>Status</th><th>News</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>
<footer id="footer-note">Loading...</footer>

<script src="nav.js"></script>
<script>
const STATUS_LABEL = { i: "Injured", d: "Doubtful", s: "Suspended", u: "Unavailable" };

async function load() {
  try {
    const res = await fetch("fpl_players.json");
    if (!res.ok) throw new Error("not found");
    const players = await res.json();
    render(players);
  } catch (err) {
    document.getElementById("footer-note").textContent = "Couldn't load fpl_players.json — run fetch_fpl_data.py and view this via the local server.";
  }
}

function render(players) {
  const flagged = players
    .filter(p => p.status !== "a")
    .sort((a, b) => a.status.localeCompare(b.status) || a.name.localeCompare(b.name));

  document.getElementById("table-body").innerHTML = flagged.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td>${p.team}</td>
      <td>${p.position}</td>
      <td><span class="status-tag status-${p.status}">${STATUS_LABEL[p.status] || p.status}</span></td>
      <td class="news-cell">${p.news || "—"}</td>
    </tr>
  `).join("") || `<tr><td colspan="5" style="text-align:center;padding:2rem;color:#8b9a92;">No players currently flagged</td></tr>`;

  document.getElementById("footer-note").textContent = `${flagged.length} players flagged out of ${players.length} total. Re-run fetch_fpl_data.py to refresh.`;
}

load();
</script>
</body>
</html>
