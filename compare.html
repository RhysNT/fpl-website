<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitchside — Compare</title>
<style>
  :root {
    --ink: #10221c; --paper: #f2f6f3; --line: #d7ded9; --pitch: #1c5c40; --pitch-dark: #123c2a;
    --amber: #e2a83f; --rise: #1c8a54; --fall: #c0463a;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 0 0 4rem; }
  header { background: var(--pitch-dark); color: var(--paper); padding: 2.2rem 1.5rem 1.6rem; position: relative; overflow: hidden; }
  header::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 40px); pointer-events: none; }
  .kicker { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin: 0 0 0.4rem; }
  h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
  .sub { margin: 0.5rem 0 0; color: #b9c9c0; font-size: 0.95rem; max-width: 54ch; }
  nav { display: flex; gap: 1rem; margin-top: 1.2rem; flex-wrap: wrap; }
  nav a { color: #b9c9c0; text-decoration: none; font-family: var(--mono); font-size: 0.76rem; letter-spacing: 0.02em; padding-bottom: 0.2rem; border-bottom: 2px solid transparent; }
  nav a.active { color: white; border-bottom-color: var(--amber); }
  nav a:hover { color: white; }

  main { max-width: 1000px; margin: 1.5rem auto 0; padding: 0 1.5rem; }

  .picker-row { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .picker-row select { flex: 1; min-width: 160px; border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.6rem; font-size: 0.85rem; background: white; }

  .table-wrap { background: white; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(16,34,28,0.06); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th { text-align: left; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: #5b6b63; padding: 0.7rem 0.8rem; border-bottom: 2px solid var(--pitch); }
  tbody td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  td.metric-label { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; color: #6c7a72; white-space: nowrap; }
  td.best { color: var(--rise); font-weight: 700; }
  th.player-col { font-weight: 800; font-size: 0.95rem; color: var(--ink); text-transform: none; letter-spacing: 0; }

  footer { max-width: 1000px; margin: 1.2rem auto 0; padding: 0 1.5rem; font-size: 0.78rem; color: #6c7a72; font-family: var(--mono); }
</style>
</head>
<body>

<header>
  <p class="kicker">Player Comparison</p>
  <h1>Who should I pick</h1>
  <p class="sub">Pick up to 3 players and compare form, value, expected involvement and fixture ease side by side.</p>
  <nav id="site-nav"></nav>
</header>

<main>
  <div class="picker-row" id="picker-row"></div>
  <div class="table-wrap">
    <table id="compare-table"></table>
  </div>
</main>

<footer id="footer-note">Loading...</footer>

<script src="nav.js"></script>
<script>
let players = [];
let teams = [];
let fixtures = [];
let selected = [null, null, null];

async function load() {
  try {
    const [pRes, tRes, fRes] = await Promise.all([
      fetch("fpl_players.json"), fetch("fpl_teams.json"), fetch("fpl_fixtures.json"),
    ]);
    players = await pRes.json();
    teams = await tRes.json();
    fixtures = await fRes.json();
  } catch (err) {
    document.getElementById("footer-note").textContent = "Couldn't load data files — run fetch_fpl_data.py and view this via the local server.";
    return;
  }
  renderPickers();
  renderTable();
}

function renderPickers() {
  const row = document.getElementById("picker-row");
  const sorted = [...players].sort((a, b) => b.total_points - a.total_points);
  row.innerHTML = [0, 1, 2].map(i => `
    <select data-slot="${i}">
      <option value="">Select player ${i + 1}...</option>
      ${sorted.map(p => `<option value="${p.id}" ${selected[i] === p.id ? "selected" : ""}>${p.name} (${p.team})</option>`).join("")}
    </select>
  `).join("");

  row.querySelectorAll("select").forEach(sel => {
    sel.addEventListener("change", () => {
      selected[Number(sel.dataset.slot)] = sel.value ? Number(sel.value) : null;
      renderTable();
    });
  });
}

function avgNext5Difficulty(player) {
  const teamById = Object.fromEntries(teams.map(t => [t.id, t]));
  const team = teams.find(t => t.name === player.team);
  if (!team) return null;
  const upcoming = fixtures.filter(f => f.team_h === team.id || f.team_a === team.id).slice(0, 5);
  if (upcoming.length === 0) return null;
  const strengths = upcoming.map(f => {
    const isHome = f.team_h === team.id;
    const oppId = isHome ? f.team_a : f.team_h;
    const opp = teamById[oppId];
    return opp ? opp.strength_score + (isHome ? -6 : 6) : 50;
  });
  return strengths.reduce((a, b) => a + b, 0) / strengths.length;
}

function renderTable() {
  const chosen = selected.map(id => id ? players.find(p => p.id === id) : null);
  const anySelected = chosen.some(Boolean);
  const table = document.getElementById("compare-table");

  if (!anySelected) {
    table.innerHTML = `<tr><td style="padding:2rem;text-align:center;color:#8b9a92;">Pick 2 or 3 players above to compare them</td></tr>`;
    return;
  }

  const metrics = [
    { label: "Position", get: p => p.position, higherBetter: null },
    { label: "Price", get: p => `£${p.price.toFixed(1)}m`, raw: p => p.price, higherBetter: false },
    { label: "Total Points", get: p => p.total_points, raw: p => p.total_points, higherBetter: true },
    { label: "Form", get: p => p.form.toFixed(1), raw: p => p.form, higherBetter: true },
    { label: "Points / £m", get: p => (p.total_points / p.price).toFixed(1), raw: p => p.total_points / p.price, higherBetter: true },
    { label: "xGI (season)", get: p => p.expected_goal_involvements.toFixed(2), raw: p => p.expected_goal_involvements, higherBetter: true },
    { label: "Next GW xPts", get: p => p.ep_next.toFixed(1), raw: p => p.ep_next, higherBetter: true },
    { label: "Ownership", get: p => `${p.selected_by_percent.toFixed(1)}%`, raw: p => p.selected_by_percent, higherBetter: null },
    { label: "Next 5 Fixture Ease", get: p => { const d = avgNext5Difficulty(p); return d === null ? "—" : d.toFixed(0) + "/100"; }, raw: p => avgNext5Difficulty(p), higherBetter: false },
  ];

  const activeIndexes = chosen.map((p, i) => p ? i : null).filter(i => i !== null);

  let html = `<thead><tr><th></th>${chosen.map((p) => p ? `<th class="player-col">${p.name}<br><span style="font-family:var(--mono);font-size:0.7rem;color:#6c7a72;font-weight:400;">${p.team}</span></th>` : `<th></th>`).join("")}</tr></thead><tbody>`;

  metrics.forEach(m => {
    const rawValues = chosen.map(p => p ? (m.raw ? m.raw(p) : m.get(p)) : null);
    let bestIndex = null;
    if (m.higherBetter !== null) {
      const valid = activeIndexes.filter(i => rawValues[i] !== null && !isNaN(rawValues[i]));
      if (valid.length > 0) {
        bestIndex = valid.reduce((best, i) =>
          (m.higherBetter ? rawValues[i] > rawValues[best] : rawValues[i] < rawValues[best]) ? i : best
        , valid[0]);
      }
    }
    html += `<tr><td class="metric-label">${m.label}</td>${chosen.map((p, i) =>
      p ? `<td class="${i === bestIndex ? "best" : ""}">${m.get(p)}</td>` : `<td></td>`
    ).join("")}</tr>`;
  });

  html += `</tbody>`;
  table.innerHTML = html;
}

load();
</script>

</body>
</html>
